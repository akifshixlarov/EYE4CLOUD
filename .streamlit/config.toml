[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#151a21"
textColor = "#e8eaed"
font = "sans serif"

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[server]
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false
