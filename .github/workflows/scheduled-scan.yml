name: Scheduled Azure Cloud Scan

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allows manual one-click trigger from the GitHub Actions UI

jobs:
  audit:
    name: Audit Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Azure Activation Credentials
        id: check_auth
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Scheduled Scan Dormant::Azure credentials are not configured in GitHub Secrets. This workflow is currently dormant. To activate automated scanning, add AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in Settings -> Secrets and variables -> Actions."
            echo "================================================================================="
            echo "ℹ️  SCHEDULED SCAN STATUS: DORMANT (NOT ACTIVATED)"
            echo "   To activate automated scans, configure your Azure Service Principal secrets:"
            echo "   - AZURE_CLIENT_ID"
            echo "   - AZURE_CLIENT_SECRET"
            echo "   - AZURE_TENANT_ID"
            echo "   - AZURE_SUBSCRIPTION_ID"
            echo "   Under: Repository Settings -> Secrets and variables -> Actions"
            echo "================================================================================="
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Azure credentials detected. Proceeding with scan."
          fi

      - name: Set up Python 3.11
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check_auth.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Azure Misconfiguration Scan
        if: steps.check_auth.outputs.configured == 'true'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SUBSCRIPTION_IDS: ${{ secrets.AZURE_SUBSCRIPTION_IDS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/scheduled_scan.py

      - name: Archive Scan Findings
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azure-scan-results-${{ github.run_id }}
          path: |
            results/
            logs/
          retention-days: 14
